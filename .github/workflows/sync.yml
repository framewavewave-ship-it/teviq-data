name: Sync Teviq Market Data

on:
  schedule:
    - cron: '15 */6 * * 1-5'   # Auto-sync every 6 hours, Monday to Friday
  workflow_dispatch:           # Manual Run button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull and merge market candles
        run: python sync_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "teviq-bot"
          git config user.email "bot@teviq.store"
          git add "*.json"
          git diff --staged --quiet || git commit -m "chore: update market candles $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
